<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invoices draft</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div data-kalka-name="Invoices (draft)" style="width: 1440px; min-height: 900px; display: flex; flex-direction: column; background-color: #FFFFFF">
    <div data-kalka-name="Header" style="position: relative; height: 72px; align-self: stretch; background-color: #FFFFFF">
      <span data-kalka-name="Logo" style="position: absolute; left: 22px; top: 23px; font-family: system-ui; font-size: 21px; font-weight: 700; color: #0E1825">Parkmed</span>
      <span data-kalka-name="App name" style="position: absolute; left: 131px; top: 26px; font-family: system-ui; font-size: 17px; color: #536076">PO &amp; Invoices</span>
      <span data-kalka-name="User" style="position: absolute; left: 1290px; top: 27px; font-family: system-ui; font-size: 14px; color: #536076">suresh.babu@parkmed.example</span>
    </div>
    <div data-kalka-name="Main" style="display: flex; flex-direction: column; gap: 19px; padding-top: 30px; padding-right: 37px; padding-bottom: 30px; padding-left: 37px; align-self: stretch">
      <div data-kalka-name="Title row" style="display: flex; justify-content: space-between; align-items: center; align-self: stretch">
        <h1 data-kalka-name="Title" style="font-family: system-ui; font-size: 28px; font-weight: 700; color: #0D1724">Invoices</h1>
        <button data-kalka-type="frame" data-kalka-name="New invoice" style="display: flex; align-items: center; padding-top: 9px; padding-right: 15px; padding-bottom: 9px; padding-left: 15px; border-radius: 10px; background-color: #0F766E"><span style="font-family: system-ui; font-size: 15px; color: #FFFFFF">New invoice</span></button>
      </div>
      <div data-kalka-name="Summary cards" style="display: flex; gap: 13px; align-self: stretch">
        <div data-kalka-name="Card outstanding" style="display: flex; flex-direction: column; gap: 3px; padding-top: 17px; padding-right: 17px; padding-bottom: 17px; padding-left: 17px; border-radius: 12px; background-color: #F5F7FA; width: 260px"><span style="font-family: system-ui; font-size: 13px; color: #536076">Outstanding</span><span style="font-family: system-ui; font-size: 26px; font-weight: 700; color: #0D1724">₹38,12,400</span></div>
        <div data-kalka-name="Card overdue" style="display: flex; flex-direction: column; gap: 3px; padding-top: 17px; padding-right: 17px; padding-bottom: 17px; padding-left: 17px; border-radius: 12px; background-color: #F5F7FA; width: 260px"><span style="font-family: system-ui; font-size: 13px; color: #536076">Overdue</span><span style="font-family: system-ui; font-size: 26px; font-weight: 700; color: #DC2626">₹3,15,000</span></div>
      </div>
      <div data-kalka-name="Table" style="display: flex; flex-direction: column; align-self: stretch">
        <div data-kalka-name="Head" style="display: flex; padding-top: 11px; padding-bottom: 11px; background-color: #FAFBFC">
          <span style="width: 400px; padding-left: 13px; font-family: system-ui; font-size: 12px; color: #536076">Invoice</span>
          <span style="width: 300px; font-family: system-ui; font-size: 12px; color: #536076">Client</span>
          <span style="width: 200px; font-family: system-ui; font-size: 12px; color: #536076">Amount</span>
        </div>
        <div data-kalka-name="Row 1" style="display: flex; padding-top: 13px; padding-bottom: 13px; gap: 0px">
          <span style="width: 400px; font-family: system-ui; font-size: 15px; color: #0D1724">IN/2026-27/0142</span>
          <span style="width: 300px; font-family: system-ui; font-size: 15px; color: #0D1724">Northgate Hospital</span>
          <span style="width: 200px; font-family: system-ui; font-size: 15px; color: #0D1724">₹4,72,000.00</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
